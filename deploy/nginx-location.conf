# Paste into the angulo-solutions.com 443 server block of
# /etc/nginx/sites-available/10-private-workspace (VPN-only admin plane).
#
# No trailing slash on proxy_pass: the app is built with
# BASE_PATH=/industry-intel and expects the prefix on every request.
location = /industry-intel { return 301 /industry-intel/; }

location /industry-intel/ {
    proxy_pass http://127.0.0.1:8070;
    proxy_http_version 1.1;
    # Server Actions compare the Origin header with the forwarded host.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Source previews fetch remote pages; give them time.
    proxy_read_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
}
