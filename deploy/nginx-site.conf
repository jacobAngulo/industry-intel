# Industry Intel -- public server block.
#
# Install as /etc/nginx/sites-available/30-public-industry-intel. Enable it only
# after, in this order:
#   1. DNS: A record industry-intel.angulo-solutions.com -> 187.124.52.253
#   2. Certificate: certbot certonly --webroot -w /var/www/html \
#        -d industry-intel.angulo-solutions.com
#   3. The app that gates every page (this repo at or after the auth change) runs.
#      The version before it has no login: never route that one publicly.
#
# No allow/deny: the sign-in and the approved access request are the gate.
# Needs the web_general and web_auth zones of /etc/nginx/conf.d/rate-limits.conf.

server {
    listen 80;
    listen [::]:80;
    server_name industry-intel.angulo-solutions.com;

    # The renewal is HTTP-01 webroot.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.24: `http2 on;` does not exist yet.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name industry-intel.angulo-solutions.com;

    ssl_certificate /etc/letsencrypt/live/industry-intel.angulo-solutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/industry-intel.angulo-solutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # This host only: the admin plane shares the parent domain.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    limit_req zone=web_general burst=60 nodelay;

    # Operations only. The loopback callers use port 8070 directly.
    location ^~ /api/admin { return 404; }
    location ^~ /api/health { return 404; }

    location ^~ /api/auth/ {
        limit_req zone=web_auth burst=8 nodelay;
        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;
        # Server Actions compare the Origin header with the forwarded host.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Source previews fetch remote pages.
        proxy_read_timeout 120s;
    }
}
