schema_version = 1

[deployment]
slug        = "industry-intel"
name        = "Industry Intel"
description = "Private news site: the worker reads the shared sources, a model judges each item per feed, and the web app shows what changed and why it matters."
kind        = "service"
repo        = "https://github.com/jacobAngulo/industry-intel.git"
root        = "/projects/industry-intel"
depends_on  = []

[runtime]
# One unit runs both processes (`npm start`: Next.js web + tsx worker under
# `concurrently --kill-others`), so a crash of either restarts both.
systemd_unit = "industry-intel.service"
unit_file    = "deploy/industry-intel.service"
host         = "127.0.0.1"
port         = 8070

[health]
# A stopped worker reports `degraded`; an unreadable database reports `fail`.
url       = "http://127.0.0.1:8070/api/health"
timeout_s = 5

[[routes]]
path        = "/"
origin      = "https://industry-intel.angulo-solutions.com"
public      = true
description = "Public hostname; Google sign-in and an approved access request required on every page."

[google_auth]
env_file           = ".env"
client_id_key      = "AUTH_GOOGLE_ID"
client_secret_key  = "AUTH_GOOGLE_SECRET"
authorized_origins = ["https://industry-intel.angulo-solutions.com"]
redirect_uris      = ["https://industry-intel.angulo-solutions.com/api/auth/callback/google"]
login_path         = "/login"

[product_ops]
store = "application"

[product_ops.admin_api]
base_url  = "http://127.0.0.1:8070/api/admin"
token_key = "ADMIN_API_TOKEN"

[product_ops.access_requests]
table         = "access_request"
status_column = "status"

[data]
root = "/srv/data/industry-intel"

[[data.stores]]
name        = "application"
kind        = "sqlite"
path        = "/srv/data/industry-intel/db/industry-intel.sqlite3"
description = "Feeds, sources, items, stories, judgements, votes, digests, and worker state. The web process and the worker both write it (WAL)."
backup      = { enabled = true, keep = 7, dir = "/srv/data/industry-intel/backups" }

# Logs go to journald only (journalctl -u industry-intel), so no [logs] block.

[[config.keys]]
name        = "AUTH_GOOGLE_ID"
secret      = false
required    = true
description = "Google OAuth client ID; managed by Ops Console's Google Cloud control surface."

[[config.keys]]
name        = "AUTH_GOOGLE_SECRET"
secret      = true
required    = true
description = "Google OAuth client secret; managed by Ops Console's Google Cloud control surface."

[[config.keys]]
name        = "AUTH_SECRET"
secret      = true
required    = true
description = "Session signing key; generate with openssl rand -base64 32. Without it every page answers 503."

[[config.keys]]
name        = "AUTH_URL"
secret      = false
required    = true
description = "Externally visible auth base, ending in /api/auth."

[[config.keys]]
name        = "ADMIN_API_TOKEN"
secret      = true
required    = true
description = "Bearer token (32+ characters) of the loopback-only /api/admin surface that Ops Console calls."

[[config.keys]]
name        = "ADMIN_EMAILS"
secret      = false
required    = false
description = "Comma-separated emails that can change API keys and delete feeds. Unset: nobody. It gives no access by itself."

[[config.keys]]
name        = "OLLAMA_API_KEY"
secret      = true
required    = true
description = "Ollama cloud key. Without it the worker reads sources but judges nothing, so no story shows."

[[config.keys]]
name        = "X_BEARER_TOKEN"
secret      = true
required    = false
description = "X API token for X user / keyword sources. Billed per post read."

[[config.keys]]
name     = "GITHUB_TOKEN"
secret   = true
required = false

[[config.keys]]
name     = "REDDIT_CLIENT_SECRET"
secret   = true
required = false

[[config.keys]]
name     = "IMAP_PASSWORD"
secret   = true
required = false

[[config.keys]]
name        = "DATABASE_PATH"
secret      = false
required    = true
description = "Set by the unit file, not .env."

[[config.keys]]
name        = "TICKET_BOARD_INTAKE_TOKEN"
secret      = true
required    = false
description = "Project-scoped Ticket Board intake credential used only by the Send feedback Server Action."

[[config.keys]]
name        = "TICKET_BOARD_URL"
secret      = false
required    = false
description = "Loopback Ticket Board origin; defaults to http://127.0.0.1:8040."

[[config.keys]]
name        = "TICKET_BOARD_PROJECT_SLUG"
secret      = false
required    = false
description = "Ticket Board destination project; defaults to industry-intel."
