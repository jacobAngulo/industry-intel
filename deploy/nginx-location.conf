# Replaces the two /industry-intel locations in the angulo-solutions.com 443
# block of /etc/nginx/sites-available/10-private-workspace. The app moved to its
# own hostname and has no prefix. `rewrite` runs before allow/deny, so an old
# link works off the VPN too.
location ^~ /industry-intel {
    rewrite ^/industry-intel/?(.*)$ https://industry-intel.angulo-solutions.com/$1 permanent;
}
